<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <meta name="theme-color" content="#f7f4ee" />
  <title>インターハイ敗戦から見えたこと</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="page">
    <section class="canvas-wrap" id="canvasWrap" aria-live="polite">
      <div class="image-stage" id="imageStage">
        <img
          src="assets/interhigh_flowchart.png"
          alt="インターハイ敗戦を、試合の現象、心理的要因、監督と選手の翻訳の違い、今後の指導方針まで整理したフローチャート"
          draggable="false"
        />

        <!--
          白いマスクを順番に外して、各ブロックを表示する。
          座標は元画像 1536 × 1024 を基準にした割合。
        -->
        <div class="mask mask-1" data-step="1"></div>
        <div class="mask mask-2" data-step="2"></div>
        <div class="mask mask-3" data-step="3"></div>
        <div class="mask mask-4" data-step="4"></div>
        <div class="mask mask-5" data-step="5"></div>
        <div class="mask mask-6" data-step="6"></div>
        <div class="mask mask-7" data-step="7"></div>
        <div class="mask mask-8" data-step="8"></div>
        <div class="mask mask-9" data-step="9"></div>
      </div>

      <div class="tap-hint" id="tapHint">
        タップして展開
      </div>
    </section>

    <nav class="controls" aria-label="表示操作">
      <button id="prev" type="button" aria-label="一つ戻る">←</button>
      <div class="status">
        <strong id="stepLabel">タイトル</strong>
        <span id="counter">0 / 9</span>
      </div>
      <button id="next" type="button" aria-label="次を表示">→</button>
      <button id="reset" type="button" aria-label="最初に戻る">↺</button>
      <button id="fullscreen" type="button" aria-label="全画面表示">⛶</button>
    </nav>

    <div class="progress" aria-hidden="true">
      <div id="progressBar"></div>
    </div>
  </main>
  <script src="script.js"></script>
</body>
</html>
